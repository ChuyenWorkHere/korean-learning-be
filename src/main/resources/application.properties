spring.application.name=kbee

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secretKey=${JWT_SECRET_KEY}
app.jwt.expirationTimeSecond=86400

frontend.url = http://localhost:5173

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-secret=${CLOUD_SECRET_KEY}


assemblyai.api-key=${ASSEMBLY_API_KEY}

gemini.api-key=${GEMINI_API_KEY}

# VNPay configurations
vnp_TmnCode=${VNPAY_TMN_CODE}
vnp_HashSecret=${VNPAY_HASH_SECRET}
vnp_Url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp_ApiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnp_ReturnUrl=http://localhost:5173/payment/vnpay_return

google.client.id=${GOOGLE_CLIENT_ID}

openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.model=nvidia/nemotron-3-super-120b-a12b:free
