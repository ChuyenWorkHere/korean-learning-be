spring.application.name=kbee

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

app.jwt.secretKey=${JWT_SECRET_KEY}
app.jwt.expirationTimeSecond=86400

frontend.url = http://localhost:5173

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-secret=${CLOUD_SECRET_KEY}


assemblyai.api-key=${ASSEMBLY_API_KEY}

ai.provider=digitalocean
gemini.api-key=${GEMINI_API_KEY}

# VNPay configurations
vnp_TmnCode=${VNPAY_TMN_CODE}
vnp_HashSecret=${VNPAY_HASH_SECRET}
vnp_Url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp_ApiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnp_ReturnUrl=http://localhost:5173/payment/vnpay_return

google.client.id=${GOOGLE_CLIENT_ID}

digitalocean.ai.api-key=${OPENAI_API_KEY}
digitalocean.ai.model=deepseek-4-flash
openai.api-key=${OPENAI_API_KEY}
openai.model=deepseek-4-flash
