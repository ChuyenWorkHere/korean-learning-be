name: CI KBee Backend

# 1. Kích hoạt khi có commit đẩy lên nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    # 2. Môi trường máy ảo Ubuntu do GitHub cấp
    runs-on: ubuntu-latest

    # 3. Các bước thực hiện tuần tự
    steps:
      # Bước 3.1: Kéo mã nguồn từ GitHub về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 3.2: Đăng nhập vào Docker Hub bằng Secrets đã lưu
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Bước 3.3: Thiết lập Docker Buildx (hỗ trợ build multi-stage tối ưu)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3.4: Tự động build Dockerfile và push image lên Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: vanchuyenle2004/kbee-backend:latest